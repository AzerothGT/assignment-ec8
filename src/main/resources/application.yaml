spring:
  application:
    name: ProductManagementApi
  datasource:
    url: jdbc:mysql://localhost:3306/db_product_management?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: 
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.MySQLDialect
server:
  port: 8080

app:
  jwt:
    # Secret key untuk menandatangani token JWT (HS256). Minimal 32 karakter.
    # Ganti dengan nilai yang aman (env var) jika dipakai di produksi.
    secret: ec8-product-catalog-jwt-secret-key-2026-change-me-in-production
    expiration-ms: 86400000